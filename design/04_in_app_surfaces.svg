<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10182B"/><stop offset="1" stop-color="#05070E"/>
    </linearGradient>
  </defs>

  <rect width="412" height="892" fill="url(#chrome)"/>

  <!-- app title bar (auto-hides) -->
  <rect x="0" y="0" width="412" height="64" fill="#FFFFFF" opacity="0.08"/>
  <text x="20" y="40" fill="#FFFFFF" font-size="15" font-weight="300">◀ ▶</text>
  <rect x="80" y="16" width="290" height="32" fill="#FFFFFF" opacity="0.12"/>
  <text x="92" y="37" fill="#FFFFFF" font-size="13" opacity="0.9">m.youtube.com/watch?v=…</text>
  <text x="380" y="38" fill="#FFFFFF" font-size="16">⟳</text>

  <!-- webpage content -->
  <rect x="0" y="64" width="412" height="270" fill="#282828"/>
  <text x="206" y="200" fill="#FF0000" font-size="64" text-anchor="middle">▶</text>
  <rect x="0" y="334" width="412" height="18" fill="#FF0000" opacity="0.85"/>
  <circle cx="380" cy="343" r="7" fill="#FFFFFF"/>

  <text x="20" y="392" fill="#FFFFFF" font-size="16" font-weight="600">Building a Compose Launcher OS</text>
  <text x="20" y="416" fill="#FFFFFF" font-size="12" opacity="0.6">1.2M views · 3 days ago</text>

  <!-- game: 2048 in-app preview -->
  <text x="24" y="470" fill="#FFFFFF" font-size="20" font-weight="200">Games</text>
  <g>
    <rect x="24" y="490" width="180" height="180" fill="#BBADA0"/>
    <rect x="34" y="500" width="76" height="76" fill="#EEE4DA"/>
    <text x="60" y="546" fill="#776E65" font-size="24" text-anchor="middle">2</text>
    <rect x="118" y="500" width="76" height="76" fill="#F2B179"/>
    <text x="144" y="546" fill="#FFFFFF" font-size="24" text-anchor="middle">8</text>
    <rect x="34" y="584" width="76" height="76" fill="#F59563"/>
    <text x="60" y="630" fill="#FFFFFF" font-size="24" text-anchor="middle">64</text>
    <rect x="118" y="584" width="76" height="76" fill="#EDC850"/>
    <text x="144" y="630" fill="#FFFFFF" font-size="24" text-anchor="middle">512</text>
  </g>

  <!-- dialer keypad preview -->
  <g>
    <rect x="228" y="490" width="160" height="180" fill="#FFFFFF" opacity="0.08"/>
    <text x="252" y="524" fill="#FFFFFF" font-size="18" font-weight="300">555-0104</text>
    <g fill="#FFFFFF" opacity="0.9" font-size="18" text-anchor="middle">
      <text x="258" y="560">1</text><text x="308" y="560">2</text><text x="358" y="560">3</text>
      <text x="258" y="592">4</text><text x="308" y="592">5</text><text x="358" y="592">6</text>
      <text x="258" y="624">7</text><text x="308" y="624">8</text><text x="358" y="624">9</text>
    </g>
    <circle cx="308" cy="650" r="18" fill="#008A00"/>
    <text x="302" y="657" fill="#FFFFFF" font-size="16">✆</text>
  </g>

  <!-- weather strip -->
  <g>
    <rect x="24" y="700" width="364" height="90" fill="#00ABA9"/>
    <text x="44" y="744" fill="#FFFFFF" font-size="30" font-weight="200">21°</text>
    <text x="44" y="768" fill="#FFFFFF" font-size="12" opacity="0.85">Partly cloudy · Wind 12 km/h</text>
    <text x="250" y="738" fill="#FFFFFF" font-size="12">Thu 21°  Fri 24°  Sat 19°</text>
    <text x="250" y="760" fill="#FFFFFF" font-size="12">Sun 22°  Mon 25°  Tue 20°</text>
  </g>

  <!-- auto-hide hint -->
  <text x="206" y="840" fill="#FFFFFF" font-size="12" opacity="0.5" text-anchor="middle">tap anywhere to hide the URL bar · swipe up from bottom edge to minimize</text>
</svg>
