<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070E"/><stop offset="1" stop-color="#10182B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="412" height="892" fill="url(#bg)"/>
  <!-- blurred remnants of underlying apps -->
  <rect x="40" y="120" width="330" height="560" fill="#0050EF" opacity="0.12" filter="url(#blur2)"/>
  <rect x="120" y="260" width="240" height="420" fill="#E51400" opacity="0.10" filter="url(#blur2)"/>

  <text x="24" y="72" fill="#FFFFFF" font-size="34" font-weight="200">Task switcher</text>
  <text x="24" y="98" fill="#FFFFFF" font-size="13" opacity="0.6">Swipe ← → between cards · swipe up to dismiss</text>

  <!-- left neighbor card (peeking) -->
  <g opacity="0.45">
    <rect x="-140" y="240" width="260" height="420" rx="4" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <rect x="-110" y="280" width="56" height="56" fill="#00ABA9"/>
    <text x="-96" y="318" fill="#FFFFFF" font-size="26">🌐</text>
    <text x="-110" y="368" fill="#FFFFFF" font-size="14">Browser</text>
  </g>

  <!-- focused center card -->
  <g>
    <rect x="76" y="200" width="260" height="470" rx="4" fill="url(#card)" stroke="#0063B1" stroke-opacity="0.9" stroke-width="2"/>
    <rect x="100" y="232" width="64" height="64" fill="#008A00"/>
    <text x="112" y="276" fill="#FFFFFF" font-size="30">✆</text>
    <text x="100" y="330" fill="#FFFFFF" font-size="18" font-weight="600">Phone</text>
    <text x="100" y="352" fill="#FFFFFF" font-size="12" opacity="0.7">Active 4m ago</text>
    <!-- app screenshot placeholder -->
    <rect x="100" y="380" width="212" height="250" fill="#FFFFFF" opacity="0.06"/>
    <text x="150" y="500" fill="#FFFFFF" font-size="13" opacity="0.5">Live app snapshot</text>
  </g>

  <!-- right neighbor card -->
  <g opacity="0.45">
    <rect x="292" y="240" width="260" height="420" rx="4" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <rect x="322" y="280" width="56" height="56" fill="#D80073"/>
    <text x="336" y="318" fill="#FFFFFF" font-size="26">✉</text>
    <text x="322" y="368" fill="#FFFFFF" font-size="14">Messages</text>
  </g>

  <!-- dismissal affordance -->
  <g transform="translate(186, 700)">
    <rect x="0" y="0" width="40" height="40" fill="#E51400" opacity="0.9"/>
    <text x="13" y="27" fill="#FFFFFF" font-size="20">✕</text>
  </g>
  <text x="206" y="770" fill="#FFFFFF" font-size="13" opacity="0.6" text-anchor="middle">◀ swipe ▶ to navigate</text>

  <!-- edge hints -->
  <rect x="0" y="0" width="6" height="892" fill="#0063B1" opacity="0.35"/>
  <rect x="406" y="0" width="6" height="892" fill="#0063B1" opacity="0.35"/>
</svg>
