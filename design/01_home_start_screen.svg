<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="0.5" stop-color="#1B1B3A"/>
      <stop offset="1" stop-color="#3B1E5E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A6FF0"/><stop offset="1" stop-color="#0050EF"/>
    </linearGradient>
    <linearGradient id="tileTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C8C6"/><stop offset="1" stop-color="#00ABA9"/>
    </linearGradient>
  </defs>

  <!-- wallpaper passthrough -->
  <rect width="412" height="892" fill="url(#wall)"/>
  <circle cx="340" cy="720" r="180" fill="#6A00FF" opacity="0.25" filter="url(#blur)"/>
  <circle cx="60" cy="200" r="150" fill="#0050EF" opacity="0.2" filter="url(#blur)"/>

  <!-- status bar -->
  <text x="20" y="34" fill="#FFFFFF" font-size="14" opacity="0.95">9:41</text>
  <text x="360" y="34" fill="#FFFFFF" font-size="12" opacity="0.85">4G ▂▄▆ 87%</text>

  <!-- typographic clock -->
  <text x="24" y="150" fill="#FFFFFF" font-size="72" font-weight="200">9:41</text>
  <text x="26" y="184" fill="#FFFFFF" font-size="15" font-weight="300" opacity="0.75">Thursday, March 14</text>

  <!-- live tile grid (4 columns, square metro tiles) -->
  <!-- Chess tile 2x2 with 3D flip mid-turn -->
  <g>
    <rect x="24" y="216" width="180" height="180" fill="url(#tileBlue)"/>
    <text x="40" y="256" fill="#FFFFFF" font-size="42">♞</text>
    <text x="40" y="352" fill="#FFFFFF" font-size="15" font-weight="600">Chess</text>
    <text x="40" y="374" fill="#FFFFFF" font-size="12" opacity="0.8">vs AI · depth 3</text>
    <!-- flip hint: rotated ghost face -->
    <rect x="204" y="216" width="86" height="86" fill="#0063B1" opacity="0.35" transform="rotateY" />
  </g>

  <!-- Weather tile 2x1 -->
  <g>
    <rect x="204" y="216" width="184" height="86" fill="url(#tileTeal)"/>
    <text x="220" y="252" fill="#FFFFFF" font-size="30" font-weight="200">21°</text>
    <text x="220" y="274" fill="#FFFFFF" font-size="12" opacity="0.85">Partly cloudy</text>
    <text x="330" y="262" fill="#FFFFFF" font-size="30">⛅</text>
  </g>
  <!-- News live tile 2x1 -->
  <g>
    <rect x="204" y="310" width="184" height="86" fill="#E51400"/>
    <text x="220" y="346" fill="#FFFFFF" font-size="13" font-weight="600">MEEGO EDGE</text>
    <text x="220" y="366" fill="#FFFFFF" font-size="12" opacity="0.85">Spring physics at 120 FPS…</text>
  </g>

  <!-- 1x1 tiles row -->
  <g>
    <rect x="24" y="404" width="86" height="86" fill="#008A00"/>
    <text x="52" y="452" fill="#FFFFFF" font-size="30">✆</text>
    <text x="42" y="480" fill="#FFFFFF" font-size="11" opacity="0.9">Phone</text>
  </g>
  <g>
    <rect x="118" y="404" width="86" height="86" fill="#D80073"/>
    <text x="146" y="452" fill="#FFFFFF" font-size="30">✉</text>
    <text x="132" y="480" fill="#FFFFFF" font-size="11" opacity="0.9">Messages</text>
  </g>
  <g>
    <rect x="212" y="404" width="86" height="86" fill="#FA6800"/>
    <text x="240" y="452" fill="#FFFFFF" font-size="30">▦</text>
    <text x="234" y="480" fill="#FFFFFF" font-size="11" opacity="0.9">2048</text>
  </g>
  <g>
    <rect x="306" y="404" width="86" height="86" fill="#6A00FF"/>
    <text x="334" y="452" fill="#FFFFFF" font-size="30">▮▮▮</text>
    <text x="328" y="480" fill="#FFFFFF" font-size="11" opacity="0.9">Tetris</text>
  </g>

  <!-- second row: browser 2x1, notes, calculator -->
  <g>
    <rect x="24" y="498" width="180" height="86" fill="#1B1B3A" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="40" y="536" fill="#FFFFFF" font-size="24">🌐</text>
    <text x="76" y="534" fill="#FFFFFF" font-size="14" font-weight="600">Browser</text>
    <text x="40" y="562" fill="#FFFFFF" font-size="11" opacity="0.7">youtube.com</text>
  </g>
  <g>
    <rect x="212" y="498" width="86" height="86" fill="#00ABA9"/>
    <text x="240" y="546" fill="#FFFFFF" font-size="28">✎</text>
    <text x="234" y="574" fill="#FFFFFF" font-size="11" opacity="0.9">Notes</text>
  </g>
  <g>
    <rect x="306" y="498" width="86" height="86" fill="#4B4B4B"/>
    <text x="328" y="540" fill="#FFFFFF" font-size="20" font-weight="300">1+2</text>
    <text x="334" y="566" fill="#FFFFFF" font-size="18">=3</text>
  </g>

  <!-- edge gesture hints -->
  <rect x="0" y="0" width="6" height="892" fill="#FFFFFF" opacity="0.08"/>
  <rect x="406" y="0" width="6" height="892" fill="#FFFFFF" opacity="0.08"/>
  <rect x="0" y="886" width="412" height="6" fill="#FFFFFF" opacity="0.08"/>
  <rect x="0" y="0" width="412" height="6" fill="#FFFFFF" opacity="0.08"/>

  <!-- all-apps affordance -->
  <text x="196" y="856" fill="#FFFFFF" font-size="14" opacity="0.6" text-anchor="middle">▲ all apps</text>
</svg>
